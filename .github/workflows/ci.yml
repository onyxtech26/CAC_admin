name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type errors went unnoticed for months because vite build uses esbuild
      # and does not type-check. This gate is the reason that cannot recur.
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
